<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="description" content="ITZFIZZ scroll-driven hero animation assignment." />
  <title>ITZFIZZ — Scroll-Driven Hero</title>

  <!-- Tailwind CSS: CDN build keeps GitHub Pages deployment build-free. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel run directly in the browser; no Node/npm step is required. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- GSAP + ScrollTrigger provide the scroll-scrubbed interaction. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./src/main.jsx"></script>
</body>
</html>
